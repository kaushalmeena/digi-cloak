<app-tabs />
<app-intro
  class="mt-8"
  title="Reveal a hidden message"
  description="Open an image made with Digi-Cloak and enter its password to read the message inside."
/>

<form class="mt-8 flex flex-col gap-6" (submit)="handleSubmit($event)">
  <app-dropzone
    inputId="image"
    label="Image with a hidden message"
    accept="image/png, image/gif, image/jpeg, image/webp"
    formats="The PNG saved from Digi-Cloak"
    [preview]="previewImageSource()"
    (fileChange)="handleFile($event)"
  />

  <app-password
    inputId="password"
    label="Password"
    placeholder="The password used to hide it"
    (valueChange)="handlePasswordInput()"
  />

  @if (error()) {
    <app-alert>{{ error() }}</app-alert>
  }

  <button
    type="submit"
    class="btn min-h-11 w-full"
    [class.btn-primary]="!decodedMessage()"
    [class.btn-secondary]="decodedMessage()"
    [disabled]="busy()"
    [attr.aria-busy]="busy()"
  >
    @if (busy()) {
      <app-loader [size]="16" />
      Revealing message…
    } @else {
      <app-icon name="unlock" [size]="16" />
      Reveal message
    }
  </button>
</form>

@if (decodedMessage()) {
  <section
    #result
    data-testid="result"
    class="panel mt-8 scroll-mt-20 transition-[opacity,translate] duration-300 ease-out-expo motion-reduce:transition-none starting:translate-y-2 starting:opacity-0"
    aria-labelledby="result-title"
  >
    <div
      class="flex items-center gap-2.5 border-b border-border py-2 pr-2 pl-4"
    >
      <span
        class="flex size-6 items-center justify-center rounded-full bg-success-soft text-success"
      >
        <app-icon name="check" [size]="14" [strokeWidth]="2.5" />
      </span>
      <h2 id="result-title" class="text-sm font-semibold">Hidden message</h2>
      <button
        type="button"
        data-testid="copy-button"
        class="btn btn-ghost ml-auto min-h-8 px-2.5"
        (click)="handleCopy()"
      >
        <app-icon [name]="copied() ? 'check' : 'copy'" [size]="15" />
        <span aria-live="polite">{{ copied() ? 'Copied' : 'Copy' }}</span>
      </button>
    </div>
    <div class="p-4">
      <app-textbox
        inputId="message"
        label="Message"
        class="[&_label]:sr-only [&>div]:mb-0"
        [readonly]="true"
        [rows]="6"
        [value]="decodedMessage()"
      />
      @if (copyError()) {
        <app-alert class="mt-3">{{ copyError() }}</app-alert>
      }
    </div>
  </section>
}
