<div class="mb-2 flex items-baseline justify-between gap-3">
  <label class="field-label" [for]="inputId()">{{ label() }}</label>
  @if (withStrength()) {
    <span
      data-testid="strength"
      class="text-xs font-medium transition-opacity duration-150"
      [class]="strength()?.colorClass ?? ''"
      [class.opacity-0]="!strength()"
      [attr.aria-hidden]="!strength()"
      aria-live="polite"
      >{{ strength()?.label ?? 'Weak' }} password</span
    >
  }
</div>
<div class="relative">
  <input
    required
    class="field-input pr-11"
    name="password"
    autocomplete="off"
    spellcheck="false"
    [id]="inputId()"
    [type]="revealed() ? 'text' : 'password'"
    [attr.placeholder]="placeholder() || null"
    [attr.aria-describedby]="hint() ? inputId() + '-hint' : null"
    (input)="onInput($event)"
  />
  <button
    type="button"
    data-testid="reveal-password"
    class="absolute inset-y-0 right-0 flex w-11 cursor-pointer items-center justify-center rounded-r-lg text-muted-foreground transition-colors duration-150 hover:text-foreground"
    [attr.aria-label]="revealed() ? 'Hide password' : 'Show password'"
    [attr.aria-pressed]="revealed()"
    (click)="toggleRevealed()"
  >
    <app-icon [name]="revealed() ? 'eye-off' : 'eye'" [size]="17" />
  </button>
</div>
@if (hint()) {
  <p class="mt-2 text-xs text-muted-foreground" [id]="inputId() + '-hint'">
    {{ hint() }}
  </p>
}
