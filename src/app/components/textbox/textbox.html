<div class="mb-2 flex items-baseline justify-between gap-3">
  <label class="field-label" [for]="inputId()">{{ label() }}</label>
  <ng-content select="[aside]" />
</div>
<textarea
  class="field-input block resize-y"
  [class.font-mono]="monospace()"
  [id]="inputId()"
  [attr.name]="name()"
  [attr.placeholder]="placeholder() || null"
  [rows]="rows()"
  [readOnly]="readonly()"
  [required]="!readonly()"
  [value]="value()"
  (input)="onInput($event)"
></textarea>
<ng-content />
