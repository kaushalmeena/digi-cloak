<header
  class="sticky top-0 z-10 border-b border-border bg-background/85 backdrop-blur-md"
>
  <div class="mx-auto flex h-14 w-full max-w-2xl items-center gap-1 px-4">
    <a
      routerLink="/"
      class="mr-auto flex items-center gap-2 rounded-md text-[15px] font-semibold tracking-tight"
    >
      <span
        class="flex size-7 items-center justify-center rounded-md bg-primary text-primary-foreground"
      >
        <app-icon name="lock" [size]="15" [strokeWidth]="2.25" />
      </span>
      Digi-Cloak
    </a>
    <nav aria-label="Main">
      <ul class="flex items-center">
        @for (item of navItems; track item.link) {
          <li>
            <a
              data-testid="nav-link"
              class="btn btn-ghost min-h-9 px-3"
              [routerLink]="item.link"
              routerLinkActive="text-foreground!"
              ariaCurrentWhenActive="page"
            >
              {{ item.title }}
            </a>
          </li>
        }
      </ul>
    </nav>
    <button
      type="button"
      data-testid="theme-toggle"
      class="btn btn-ghost btn-icon"
      [attr.aria-label]="
        darkMode() ? 'Switch to light theme' : 'Switch to dark theme'
      "
      [title]="darkMode() ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="toggleDarkMode()"
    >
      <app-icon [name]="darkMode() ? 'sun' : 'moon'" [size]="18" />
    </button>
    <a
      class="btn btn-ghost btn-icon"
      [href]="repoUrl"
      aria-label="View source on GitHub"
      title="View source on GitHub"
    >
      <app-icon name="github" [size]="18" />
    </a>
  </div>
</header>
