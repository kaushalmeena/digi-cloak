<header class="border-b border-border bg-background/85 backdrop-blur-md">
  <div class="mx-auto flex h-14 w-full max-w-5xl items-center gap-1 px-4">
    <a
      routerLink="/"
      class="mr-auto flex items-center gap-2 rounded-md text-[15px] font-semibold tracking-tight"
    >
      <span
        class="flex size-7 items-center justify-center rounded-md bg-primary text-primary-foreground"
      >
        <app-icon name="lock" [size]="15" [strokeWidth]="2.25" />
      </span>
      Digi-Cloak
    </a>

    @if (offline()) {
      <span
        data-testid="offline-badge"
        class="mr-1 flex h-7 items-center gap-1.5 rounded-full bg-muted px-2.5 text-xs text-muted-foreground"
        title="You're offline. Digi-Cloak keeps working: everything runs on your device."
        animate.enter="animate-fade-in motion-reduce:animate-none"
        animate.leave="animate-fade-out motion-reduce:animate-none"
      >
        <app-icon name="wifi-off" [size]="13" />
        Offline
      </span>
    }

    @if (canInstall()) {
      <button
        type="button"
        data-testid="install-button"
        class="btn btn-ghost btn-icon"
        aria-label="Install app"
        title="Install app"
        animate.enter="animate-fade-in motion-reduce:animate-none"
        animate.leave="animate-fade-out motion-reduce:animate-none"
        (click)="handleInstall()"
      >
        <app-icon name="install" [size]="18" />
      </button>
    }
    <a
      data-testid="nav-link"
      class="btn btn-ghost btn-icon"
      routerLink="/faqs"
      routerLinkActive="bg-muted text-foreground!"
      ariaCurrentWhenActive="page"
      aria-label="Help and FAQ"
      title="Help and FAQ"
    >
      <app-icon name="help" [size]="18" />
    </a>
    <button
      type="button"
      data-testid="theme-toggle"
      class="btn btn-ghost btn-icon"
      [attr.aria-label]="
        darkMode() ? 'Switch to light theme' : 'Switch to dark theme'
      "
      [title]="darkMode() ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="toggleDarkMode()"
    >
      <app-icon [name]="darkMode() ? 'sun' : 'moon'" [size]="18" />
    </button>
    <a
      class="btn btn-ghost btn-icon"
      [href]="repoUrl"
      aria-label="View source on GitHub"
      title="View source on GitHub"
    >
      <app-icon name="github" [size]="18" />
    </a>
  </div>
</header>
