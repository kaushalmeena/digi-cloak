<div class="mb-2 flex items-baseline justify-between gap-3">
  <label class="field-label" [for]="inputId()">{{ label() }}</label>
  @if (file()) {
    <button
      type="button"
      data-testid="remove-image"
      class="cursor-pointer rounded-sm text-xs text-muted-foreground transition-colors duration-150 hover:text-foreground"
      (click)="handleRemove()"
    >
      Remove
    </button>
  }
</div>
<div
  class="rounded-xl transition-shadow duration-150"
  [class.ring-2]="dragging()"
  [class.ring-primary]="dragging()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  @if (file()) {
    <div class="panel overflow-hidden">
      <div
        data-testid="image-preview"
        class="checkerboard flex h-56 items-center justify-center border-b border-border p-3 sm:h-64"
      >
        @if (preview()) {
          <img
            class="max-h-full max-w-full rounded-sm object-contain transition-opacity duration-200 motion-reduce:transition-none starting:opacity-0"
            alt="Selected image"
            [src]="preview()"
          />
        }
      </div>
      <div class="flex items-center gap-3 px-3 py-2.5">
        <app-icon class="text-muted-foreground" name="image-up" [size]="18" />
        <div class="min-w-0 flex-1">
          <p data-testid="file-info" class="truncate text-sm font-medium">
            {{ file()?.name }}
          </p>
          <p class="text-xs text-muted-foreground tabular-nums">
            {{ fileMeta() }}
          </p>
        </div>
        <button
          type="button"
          class="btn btn-secondary min-h-8 px-3 text-xs"
          (click)="handleBrowse()"
        >
          Replace
        </button>
      </div>
    </div>
  } @else {
    <button
      type="button"
      data-testid="dropzone"
      class="group flex min-h-44 w-full cursor-pointer flex-col items-center justify-center gap-3 rounded-xl border border-dashed border-input bg-card px-4 py-8 text-center transition-colors duration-150 hover:border-primary hover:bg-primary-soft/40"
      [class.border-primary]="dragging()"
      [class.bg-primary-soft]="dragging()"
      (click)="handleBrowse()"
    >
      <span
        class="flex size-10 items-center justify-center rounded-full bg-muted text-muted-foreground transition-colors duration-150 group-hover:bg-primary-soft group-hover:text-primary"
      >
        <app-icon name="image-up" [size]="20" />
      </span>
      <span class="text-sm">
        <span class="font-medium">Drop an image here</span>
        <span class="text-muted-foreground">, paste it, or </span>
        <span class="font-medium text-primary">click to browse</span>
      </span>
      <span class="text-xs text-muted-foreground">{{ formats() }}</span>
    </button>
  }
</div>
<input
  #fileInput
  class="sr-only"
  tabindex="-1"
  [id]="inputId()"
  name="image"
  type="file"
  [accept]="accept()"
  (change)="onInputChange($event)"
/>
